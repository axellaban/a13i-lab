<style>
  :root{
    /* Paleta: idéntica a a13i-accelerator / a13i-partner */
    --bg:          #FEFBF2;
    --border:      #E8E3DE;
    --border-2:    #EAD9C8;
    --text:        #1A1410;
    --muted:       #6B5A4A;
    --faint:       #8C7A68;
    --accent:      #D4612A;
    --accent-2:    #E15E3F;
    --accent-deep: #A04510;

    --sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;

    --maxw: 760px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ -webkit-font-smoothing:antialiased; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.6;
    min-height:100vh;
    overflow-x:hidden;
  }
  /* Textura de papel + halo cálido: mismo tratamiento que el resto de los sitios */
  body::before{
    content:''; position:fixed; inset:0; z-index:100;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    opacity:.015; pointer-events:none; mix-blend-mode:multiply;
  }
  body::after{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(900px at 18% -5%, rgba(212,97,42,0.07), transparent 62%);
  }

  a{ color:inherit; text-decoration:none; }
  ::selection{ background:rgba(212,97,42,.22); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:4px; border-radius:6px; }

  .page{
    position:relative; z-index:2;
    width:100%; max-width:var(--maxw); margin:0 auto;
    padding:clamp(44px,8vh,88px) clamp(20px,5vw,32px) clamp(72px,12vh,128px);
  }

  /* ── LOGO ────────────────────────────────────────────────────── */
  .logo{
    font-family:'Space Grotesk','Arial',sans-serif;
    font-weight:700; font-size:23px; letter-spacing:-.3px; line-height:1;
    color:#111; white-space:nowrap; display:inline-block;
    margin-bottom:clamp(48px,9vh,88px);
  }
  .logo .o{ color:#D44B2A; }
  .logo .it{ font-style:italic; font-size:.92em; }
  @media(max-width:600px){ .logo{ font-size:19px; margin-bottom:40px; } }

  /* ── TÍTULO ──────────────────────────────────────────────────── */
  h1{
    font-size:clamp(1.9rem,4.6vw,3.1rem);
    font-weight:700; line-height:1.08; letter-spacing:-.035em;
    margin-bottom:18px; max-width:15ch;
  }
  h1 .paren{ color:var(--muted); font-weight:500; white-space:nowrap; }
  .sub{
    font-size:clamp(15px,1.8vw,17px); line-height:1.6; color:var(--muted);
    max-width:56ch;
  }
  @media(max-width:600px){ h1{ max-width:100%; } }

  /* ── PROYECTOS ───────────────────────────────────────────────── */
  .list{ margin-top:clamp(56px,10vh,104px); }

  .entry{
    display:grid; grid-template-columns:48px 1fr; gap:0 20px;
    padding:clamp(28px,4vh,40px) 0;
    border-top:1px solid var(--border);
    transition:opacity .2s;
  }
  .entry:last-child{ border-bottom:1px solid var(--border); }
  .num{
    font-family:var(--mono); font-size:11px; font-weight:600;
    letter-spacing:.14em; color:var(--faint); padding-top:6px;
  }
  a.entry:hover .num{ color:var(--accent); }
  .entry h2{
    font-size:clamp(1.2rem,2.3vw,1.6rem); font-weight:800;
    letter-spacing:-.03em; line-height:1.2;
    transition:color .18s;
  }
  a.entry:hover h2{ color:var(--accent); }
  .entry .lead{
    font-size:14.5px; line-height:1.6; color:var(--muted);
    margin-top:8px; max-width:60ch;
  }

  .items{ list-style:none; margin-top:20px; display:flex; flex-direction:column; gap:16px; }
  .items > li{ padding-left:15px; border-left:2px solid var(--border-2); }
  .items .n{ display:block; font-size:14px; font-weight:700; letter-spacing:-.01em; color:var(--text); }
  .items .d{ display:block; font-size:13.5px; line-height:1.55; color:var(--muted); margin-top:3px; max-width:58ch; }

  .bullets{ list-style:none; margin-top:8px; display:flex; flex-direction:column; gap:6px; }
  .bullets li{
    position:relative; padding-left:16px;
    font-size:13.5px; line-height:1.55; color:var(--muted); max-width:58ch;
  }
  .bullets li::before{
    content:''; position:absolute; left:0; top:8px;
    width:5px; height:5px; border-radius:50%; background:var(--accent); opacity:.55;
  }

  .url{
    display:inline-flex; align-items:center; gap:7px; margin-top:22px;
    font-family:var(--mono); font-size:12px; font-weight:500; letter-spacing:.01em;
    color:var(--accent-deep); word-break:break-all;
  }
  .url .ar{ flex-shrink:0; transition:transform .18s; }
  a.entry:hover .url{ color:var(--accent); }
  a.entry:hover .url .ar{ transform:translate(2px,-2px); }

  @media(max-width:600px){
    .entry{ grid-template-columns:1fr; gap:0; }
    .num{ padding-top:0; margin-bottom:10px; }
    .items > li{ padding-left:13px; }
  }

  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body>

<div class="page">

  <span class="logo">A<span class="o">13</span>I<span class="o">_</span><span class="it">LAB</span></span>

  <h1>Laboratorio <span class="paren">(de Axel Laban)</span> impulsado por la <span id="hlCuriosidad">curiosidad</span></h1>
  <p class="sub">experimentos, mvp funcionales y productos digitales, todo vibecoding con cabeza para aprender y divertirse.</p>

  <div class="list" id="list"></div>

</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   PROYECTOS — única fuente de verdad del listado.
   Para agregar uno, sumá un objeto a este array. Se muestran en
   este orden, numerados automáticamente.

   {
     titulo: string      obligatorio
     lead:   string      opcional — una o dos líneas de qué es
     items:  [{ n, d, bullets[] }]   opcional — sub-productos o versiones
     link:   string      opcional — si está, la entrada entera es clickeable
   }
   ═══════════════════════════════════════════════════════════════ */
const PROYECTOS = [
  {
    titulo: 'Universo Loro',
    items: [
      {
        n: 'Copiloto de Entrevistas con IA',
        d: 'El #1 de América Latina. Simulacro de entrevistas con IA y feedback al instante.'
      },
      {
        n: 'Envía un Lorito',
        d: 'Nueva red social, lenta e inútil. Mensajes que tardan.'
      },
      {
        n: 'Loro Fitness',
        d: 'El juego.'
      }
    ],
    link: 'https://universo-loro.vercel.app/'
  },
  {
    titulo: 'Dashboard eCommerce Day 2026 Argentina',
    lead: 'Tablero de jurado del Demo Day, en dos versiones: Human Judge y AI Judge.',
    items: [
      {
        n: 'Human Judge',
        d: 'Los jurados humanos puntuaban a cada equipo por criterio de cada competición en un formulario, y eso se reflejaba en el tablero: indicadores, radar chart y podio. 🏎️🏆'
      },
      {
        n: 'AI Judge',
        bullets: [
          'Transcript en tiempo real, con menos de 1 segundo de latencia.',
          'Fact checking en vivo, con heatmap sobre el transcript: datos fundados, de dudosa procedencia y muy subjetivados.',
          'Indicadores y radar chart moviéndose a medida que se desarrollaba el pitch.',
          'Preguntas idóneas generadas en tiempo real para hacerle al presentador.',
          'Al terminar cada pitch, la ficha completa: puntaje, fortalezas, debilidades y veredicto.'
        ]
      }
    ],
    link: 'https://eday-2026-argentina-demo-day.vercel.app/ai-unified-commerce'
  },
  {
    titulo: 'Astra 6',
    lead: 'Render 3D que compara el paper de DeepSeek v4.1 Flash con el modelo origen de los transformers de 2018.',
    link: 'https://transformer-architecture.vercel.app/'
  }
];

/* ── Render ──────────────────────────────────────────────────── */
const esc = (v) => String(v == null ? '' : v)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

const urlLabel = (u) => esc(String(u).replace(/^https?:\/\//, '').replace(/\/$/, ''));

function itemHTML(it){
  const bullets = (it.bullets || [])
    .map(b => '<li>' + esc(b) + '</li>').join('');
  return '<li>' +
    (it.n ? '<span class="n">' + esc(it.n) + '</span>' : '') +
    (it.d ? '<span class="d">' + esc(it.d) + '</span>' : '') +
    (bullets ? '<ul class="bullets">' + bullets + '</ul>' : '') +
  '</li>';
}

function entryHTML(p, i){
  const clickable = !!p.link;
  const tag = clickable ? 'a' : 'div';
  const attrs = clickable ? ' href="' + esc(p.link) + '" target="_blank" rel="noopener"' : '';
  const items = (p.items || []).map(itemHTML).join('');

  return '<' + tag + ' class="entry"' + attrs + '>' +
    '<span class="num">' + String(i + 1).padStart(2, '0') + '</span>' +
    '<div>' +
      '<h2>' + esc(p.titulo) + '</h2>' +
      (p.lead ? '<p class="lead">' + esc(p.lead) + '</p>' : '') +
      (items ? '<ul class="items">' + items + '</ul>' : '') +
      (clickable
        ? '<span class="url">' + urlLabel(p.link) + '<span class="ar" aria-hidden="true">&#8599;</span></span>'
        : '') +
    '</div>' +
  '</' + tag + '>';
}

document.getElementById('list').innerHTML = PROYECTOS.map(entryHTML).join('');

/* Subrayado del H1: misma librería y mismos parámetros que el hero de
   a13i-accelerator. Si el CDN no carga, el texto queda legible sin la decoración. */
window.addEventListener('load', function(){
  if(!window.RoughNotation) return;
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const el = document.getElementById('hlCuriosidad');
  if(el) window.RoughNotation.annotate(el, {
    type:'underline', color:'#D4612A', strokeWidth:2, iterations:2, animationDuration:800
  }).show();
});
</script>

</body>
