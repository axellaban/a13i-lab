<script>

<style>
  :root{
    /* Paleta: idéntica a a13i-accelerator / a13i-partner */
    --bg:          #FEFBF2;
    --card:        #FFFFFF;
    --card-2:      #FDFAF3;
    --border:      #E8E3DE;
    --border-2:    #EAD9C8;
    --text:        #1A1410;
    --muted:       #6B5A4A;
    --faint:       #8C7A68;
    --accent:      #D4612A;
    --accent-2:    #E15E3F;
    --accent-deep: #A04510;
    --green:       #1E8E5A;
    --amber:       #B5790A;

    --sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;

    /* Factor de ajuste: lo baja fit() si el contenido no entra en la pantalla.
       Todo el layout esta en em, asi que con esto escala la pagina entera. */
    --s: 1;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ -webkit-font-smoothing:antialiased; }
  body{
    background:var(--bg); color:var(--text);
    font-family:var(--sans); line-height:1.55;
    overflow:hidden;
  }
  body::before{
    content:''; position:fixed; inset:0; z-index:100;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    opacity:.015; pointer-events:none; mix-blend-mode:multiply;
  }
  body::after{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(900px at 18% -5%, rgba(212,97,42,0.07), transparent 62%);
  }

  a{ color:inherit; text-decoration:none; }
  button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  ::selection{ background:rgba(212,97,42,.22); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:6px; }

  /* ── PANTALLA UNICA ──────────────────────────────────────────── */
  .screen{
    position:relative; z-index:2;
    height:100vh; height:100dvh; overflow:hidden;
    font-size:calc(clamp(10.5px, min(3.1vw, 1.78vh), 17px) * var(--s));
    padding:2.4em clamp(20px,4vw,48px) 2.4em;
    display:flex; align-items:center;
  }
  .inner{ width:100%; max-width:min(1180px, 95vw); margin:0 auto; }

  /* ── ENCABEZADO ──────────────────────────────────────────────── */
  .logo{
    font-family:'Space Grotesk','Arial',sans-serif;
    font-weight:700; font-size:1.5em; letter-spacing:-.02em; line-height:1;
    color:#111; white-space:nowrap; display:inline-block; margin-bottom:1.9em;
  }
  .logo .o{ color:#D44B2A; }
  .logo .it{ font-style:italic; font-size:.92em; }

  .head{
    display:grid; grid-template-columns:minmax(0,1fr) minmax(0,14.5em);
    gap:1.6em 3em; align-items:end;
  }
  .head-text{ min-width:0; }
  h1{
    font-size:min(2.45em, 7.4vw);
    font-weight:700; line-height:1.1; letter-spacing:-.032em;
  }
  .sub{ font-size:1.05em; line-height:1.55; color:var(--muted); margin-top:.85em; }

  /* ── MEME ────────────────────────────────────────────────────── */
  .meme{
    position:relative; overflow:hidden; aspect-ratio:4/3;
    border:1px solid var(--border-2); border-radius:1em; background:#FFFDF8;
    box-shadow:0 2px 12px rgba(31,20,16,.06), 0 14px 32px rgba(31,20,16,.08);
    transform:rotate(-1.6deg);
    transition:transform .3s cubic-bezier(.22,1,.36,1);
  }
  .meme:hover{ transform:rotate(0deg) scale(1.015); }
  .meme img, .meme .meme-fb{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; display:block;
  }
  .meme .meme-fb{ display:none; }
  .meme.is-fb img{ display:none; }
  .meme.is-fb .meme-fb{ display:block; }

  /* ── GRILLA PORTFOLIO ────────────────────────────────────────── */
  .grid{
    position:relative;
    margin-top:2.2em;
    display:grid; grid-template-columns:repeat(auto-fit, minmax(12em, 1fr)); gap:1.2em;
  }
  .card{
    position:relative; overflow:hidden; isolation:isolate; display:flex;
    background:var(--card); border:1px solid var(--border-2); border-radius:1.15em;
    box-shadow:0 2px 12px rgba(31,20,16,.05);
    transition:transform .24s cubic-bezier(.22,1,.36,1), box-shadow .24s, border-color .24s;
  }
  .card:hover{ transform:translateY(-3px); box-shadow:0 14px 34px rgba(31,20,16,.11); border-color:rgba(212,97,42,.32); }
  .card:hover .art-inner{ transform:scale(1.04); }
  .face{
    display:flex; flex-direction:column; flex:1; width:100%;
    text-align:left; padding:0; border-radius:inherit; overflow:hidden;
  }

  .art{
    display:block; position:relative; overflow:hidden;
    aspect-ratio:16/10; border-bottom:1px solid var(--border);
    background:#FFFDF8;
  }
  .art-inner{ position:absolute; inset:0; transition:transform .5s cubic-bezier(.22,1,.36,1); }
  .art-inner svg, .art-inner img{ width:100%; height:100%; display:block; object-fit:cover; }

  .body{ display:flex; flex-direction:column; flex:1; padding:1.05em 1.15em 1.15em; }
  .meta{ display:flex; align-items:center; gap:.7em; }
  .num{
    font-family:var(--mono); font-size:.7em; font-weight:600;
    letter-spacing:.16em; color:var(--faint); flex-shrink:0;
  }
  .familia{
    display:inline-flex; align-items:center; gap:.45em; flex-shrink:0;
    font-family:var(--mono); font-size:.66em; font-weight:700;
    letter-spacing:.14em; text-transform:uppercase; color:var(--accent-deep);
  }
  .familia::before{
    content:''; width:.45em; height:.45em; border-radius:50%;
    background:var(--accent); flex-shrink:0;
  }
  /* Unica linea de la ficha: una frase de 8 a 10 palabras que se explica sola.
     El nombre del proyecto aparece recien al abrir el detalle. */
  .pitch{
    display:block; font-size:1.02em; font-weight:700;
    letter-spacing:-.022em; line-height:1.32; color:var(--text);
  }

  /* Unica pista de que la ficha se abre: aparece al pasar por encima.
     Un texto por ficha se repetia seis veces y no sumaba nada. */
  .plus{
    position:absolute; top:.55em; right:.55em; z-index:2;
    width:1.9em; height:1.9em; border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center;
    background:rgba(254,251,242,.94); border:1px solid var(--border-2);
    color:var(--accent); font-size:1em; font-weight:600; line-height:1;
    opacity:0; transform:scale(.8);
    transition:opacity .2s ease, transform .2s cubic-bezier(.22,1,.36,1);
  }
  .card:hover .plus, .face:focus-visible .plus{ opacity:1; transform:scale(1); }

  /* ── MOM TEST ────────────────────────────────────────────────── */
  .momtest{
    display:flex; align-items:flex-end; gap:1.2em;
    margin-top:1.6em; padding-top:1.2em;
    border-top:1px solid var(--border);
  }
  .momtest img{ height:7em; width:auto; flex-shrink:0; margin-bottom:-.2em; }
  .momtest p{
    font-size:.85em; line-height:1.5; color:var(--muted);
    max-width:66ch; padding-bottom:.35em;
  }
  .momtest .lbl{
    font-family:var(--mono); font-size:.8em; font-weight:700;
    letter-spacing:.16em; text-transform:uppercase; color:var(--accent-deep);
    margin-right:.7em;
  }

  /* ── DETALLE: panel sobre toda la grilla ─────────────────────── */
  .backdrop{
    position:fixed; inset:0; z-index:150;
    background:rgba(31,20,16,.34); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .26s ease, visibility 0s linear .26s;
  }
  .backdrop.is-on{ opacity:1; visibility:visible; pointer-events:auto; transition-delay:0s; }

  .overlay{
    position:fixed; z-index:200;
    top:50%; left:50%;
    width:min(1080px, 92vw); height:min(660px, 82vh);
    display:grid; grid-template-columns:36% 1fr;
    background:var(--card); border:1px solid rgba(212,97,42,.35); border-radius:1.15em;
    box-shadow:0 24px 70px rgba(31,20,16,.24); overflow:hidden;
    font-size:calc(1em * var(--so, 1));
    opacity:0; transform:translate(-50%,-50%) scale(.98); pointer-events:none; visibility:hidden;
    transition:opacity .26s ease, transform .26s cubic-bezier(.22,1,.36,1), visibility 0s linear .26s;
  }
  .overlay.is-on{
    opacity:1; transform:translate(-50%,-50%) scale(1);
    pointer-events:auto; visibility:visible; transition-delay:0s;
  }

  .ov-art{
    position:relative; overflow:hidden;
    border-right:1px solid var(--border);
    /* plano y del mismo tono que el fondo de los SVG: asi no se ve el borde
       del arte cuando entra entero en un contenedor mas angosto */
    background:#FFFDF8;
  }
  .ov-art svg, .ov-art img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }

  .ov-body{ display:flex; flex-direction:column; min-width:0; overflow:hidden; padding:1.5em 1.6em 1.4em; }
  .ov-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:1em; }
  .ov-meta{ margin-bottom:.45em; }
  .ov-meta::after{ display:none; }
  .overlay h3{ font-size:1.5em; font-weight:800; letter-spacing:-.035em; line-height:1.15; }
  .close{
    width:2em; height:2em; border-radius:.55em; flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center;
    background:rgba(26,20,16,.06); color:var(--muted); font-size:.95em; line-height:1;
    transition:background .16s, color .16s;
  }
  .close:hover{ background:rgba(212,97,42,.14); color:var(--accent); }
  .overlay .lead{ font-size:.92em; line-height:1.5; color:var(--muted); margin-top:.7em; max-width:62ch; }

  .items{ list-style:none; margin-top:1.1em; display:flex; flex-direction:column; gap:.85em; }
  .items > li{ padding-left:.9em; border-left:2px solid var(--border-2); }
  .items .n{ display:block; font-size:.92em; font-weight:700; letter-spacing:-.015em; color:var(--text); }
  .items .d{ display:block; font-size:.88em; line-height:1.45; color:var(--muted); margin-top:.12em; max-width:64ch; }
  .bullets{ list-style:none; margin-top:.45em; display:flex; flex-direction:column; gap:.35em; }
  .bullets li{
    position:relative; padding-left:1.05em;
    font-size:.88em; line-height:1.45; color:var(--muted); max-width:64ch;
  }
  .bullets li::before{
    content:''; position:absolute; left:0; top:.55em;
    width:.36em; height:.36em; border-radius:50%; background:var(--accent); opacity:.6;
  }
  .visit{
    display:inline-flex; align-items:center; gap:.6em; align-self:flex-start;
    margin-top:auto; padding-top:1.2em;
    font-family:var(--mono); font-size:.8em; font-weight:600;
    color:var(--accent-deep); overflow-wrap:anywhere;
  }
  .visit:hover{ color:var(--accent); }
  .visit .ar{ flex-shrink:0; transition:transform .18s; }
  .visit:hover .ar{ transform:translate(2px,-2px); }

  /* ── MOBILE ──────────────────────────────────────────────────── */
  @media(max-width:820px){
    .screen{ padding:1.8em clamp(16px,5vw,28px); align-items:flex-start; }
    .logo{ margin-bottom:1.3em; }
    .head{ display:block; }
    .meme{ width:42%; max-width:8.5em; margin-top:1em; }
    .grid{ margin-top:1.5em; grid-template-columns:1fr; gap:.8em; }
    .card{ border-radius:.9em; }
    .card:hover{ transform:none; }
    .face{ flex-direction:row; align-items:stretch; }
    .art{
      aspect-ratio:1/1; flex:0 0 26%; max-width:6.6em;
      border-bottom:0; border-right:1px solid var(--border);
    }
    .body{ padding:.8em .9em; justify-content:center; }
    .plus{ display:none; }
    .momtest{ margin-top:1.1em; padding-top:1em; gap:.8em; align-items:center; }
    .momtest img{ height:3.6em; margin-bottom:0; }
    .momtest p{ font-size:.82em; padding-bottom:0; }
    /* En pantalla chica el detalle ocupa toda la pantalla */
    .overlay{
      top:0; left:0; width:100%; height:100%;
      border-radius:0; border:0;
      grid-template-columns:1fr; grid-template-rows:auto 1fr;
      transform:translate(0,1.5%) scale(1);
    }
    .overlay.is-on{ transform:translate(0,0) scale(1); }
    .ov-art{ height:22vh; border-right:0; border-bottom:1px solid var(--border); }
    .ov-body{ padding:1.4em 1.3em calc(1.3em + env(safe-area-inset-bottom)); overflow:auto; }
    .overlay h3{ font-size:1.35em; }
  }

  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{ animation:none !important; transition-duration:.001ms !important; }
    .art-inner{ transform:none !important; }
  }
</style>
</head>
<body>

<div class="screen">
  <div class="inner">

    <span class="logo">A<span class="o">13</span>I<span class="o">_</span><span class="it">LAB</span></span>

    <div class="head">
        <div class="head-text">
          <h1>Mi sueño era ser <span id="hlCuriosidad" data-hl="underline" data-hl-color="#D4612A">científico loco</span> y tener un laboratorio como el de Dexter.</h1>
          <p class="sub">Hoy gracias a la IA voy plasmando casi toda mi curiosidad en experimentos 🔬🧫</p>
        </div>

        <!-- El GIF va en assets/dexter-lab.gif. Si no esta, cae solo en el
             dibujo de abajo y la pagina no se ve rota. -->
        <figure class="meme" id="meme">
          <img src="/assets/exploding-chemicals-dexter.gif" alt="El laboratorio de Dexter" id="memeImg">
          <svg class="meme-fb" viewBox="0 0 200 150" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <style>
              .bub{ animation:bub 2.6s ease-in-out infinite; }
              .bub:nth-of-type(2){ animation-delay:.5s; }
              .bub:nth-of-type(3){ animation-delay:1.1s; }
              @keyframes bub{ 0%{ transform:translateY(0); opacity:.7; } 100%{ transform:translateY(-16px); opacity:0; } }
              @media(prefers-reduced-motion:reduce){ .bub{ animation:none; } }
            </style>
            <rect width="200" height="150" fill="#FFFDF8"/>
            <g fill="none" stroke="#E2CDB4" stroke-width="2" stroke-linejoin="round">
              <path d="M78 34 h26 v30 l24 46 a6 6 0 0 1 -5 9 h-64 a6 6 0 0 1 -5 -9 l24 -46 z"/>
              <line x1="74" y1="34" x2="108" y2="34" stroke-linecap="round"/>
            </g>
            <path d="M68 96 l10 -19 h26 l10 19 a6 6 0 0 1 -5 9 h-36 a6 6 0 0 1 -5 -9 z" fill="#D4612A" fill-opacity=".8"/>
            <g fill="#D4612A" opacity=".55">
              <circle class="bub" cx="85" cy="82" r="3"/>
              <circle class="bub" cx="96" cy="86" r="2.2"/>
              <circle class="bub" cx="90" cy="76" r="1.8"/>
            </g>
            <g fill="none" stroke="#E2CDB4" stroke-width="2" stroke-linecap="round">
              <path d="M140 40 v46 a9 9 0 0 0 18 0 v-46"/>
              <line x1="136" y1="40" x2="162" y2="40"/>
              <path d="M40 52 v34 a9 9 0 0 0 18 0 v-34"/>
              <line x1="36" y1="52" x2="62" y2="52"/>
            </g>
            <path d="M140 70 v16 a9 9 0 0 0 18 0 v-16 z" fill="#1E8E5A" fill-opacity=".7"/>
            <path d="M40 72 v14 a9 9 0 0 0 18 0 v-14 z" fill="#E15E3F" fill-opacity=".7"/>
          </svg>
        </figure>
    </div>

    <div class="grid" id="grid"></div>

    <aside class="momtest">
      <img src="/assets/mom.png" alt="" aria-hidden="true">
      <p>
        <span class="lbl">Mom Test</span>
        Cada proyecto se explica en una sola frase. Si tu mamá la lee y entiende
        de qué va, la frase queda. Si no, se reescribe.
      </p>
    </aside>

  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   ARTE DE CADA FICHA
   SVG generado, en la paleta del sitio. Si un proyecto tiene el campo
   `imagen` (ej: '/assets/loro.webp'), se usa esa captura en lugar del SVG.
   ═══════════════════════════════════════════════════════════════ */
const ART = {
  /* Universo Loro: un nucleo con productos en orbita */
  loro: `<svg viewBox="0 0 200 125" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <style>
      .art-spin{ transform-origin:100px 62px; animation:art-spin 30s linear infinite; }
      .art-spin-r{ transform-origin:100px 62px; animation:art-spin 44s linear infinite reverse; }
      @keyframes art-spin{ to{ transform:rotate(360deg); } }
      @media(prefers-reduced-motion:reduce){ .art-spin,.art-spin-r{ animation:none; } }
    </style>
    <defs><radialGradient id="lg" cx="50%" cy="48%" r="62%">
      <stop offset="0%" stop-color="#F7E4D2"/><stop offset="100%" stop-color="#FFFDF8" stop-opacity="0"/>
    </radialGradient></defs>
    <rect width="200" height="125" fill="url(#lg)"/>
    <g fill="none" stroke="#E2CDB4" stroke-width="1">
      <ellipse cx="100" cy="62" rx="76" ry="31"/>
      <ellipse cx="100" cy="62" rx="55" ry="49"/>
      <ellipse cx="100" cy="62" rx="31" ry="31" stroke-dasharray="3 5"/>
    </g>
    <g class="art-spin">
      <circle cx="176" cy="62" r="6.5" fill="#D4612A"/>
      <circle cx="24" cy="62" r="4.5" fill="#1A1410" opacity=".8"/>
    </g>
    <g class="art-spin-r">
      <circle cx="100" cy="13" r="5.5" fill="#E15E3F"/>
      <circle cx="100" cy="111" r="4" fill="#B5790A" opacity=".85"/>
    </g>
    <circle cx="100" cy="62" r="13" fill="#1A1410"/>
    <circle cx="100" cy="62" r="20" fill="none" stroke="#D4612A" stroke-opacity=".35" stroke-width="1.5"/>
    <circle cx="104" cy="58.5" r="2.6" fill="#FEFBF2"/>
  </svg>`,

  /* eCommerce Day: radar chart + heatmap del fact checking sobre el transcript */
  eday: `<svg viewBox="0 0 200 125" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <style>
      .art-pulse{ transform-origin:62px 54px; animation:art-pulse 3.6s ease-in-out infinite; }
      @keyframes art-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
      @media(prefers-reduced-motion:reduce){ .art-pulse{ animation:none; } }
    </style>
    <rect width="200" height="125" fill="#FFFDF8"/>
    <g fill="none" stroke="#E2CDB4" stroke-width="1">
      <polygon points="62,16 98,42 84,84 40,84 26,42"/>
      <polygon points="62,35 80,48 73,69 51,69 44,48"/>
    </g>
    <g stroke="#EAD9C8" stroke-width=".8">
      <line x1="62" y1="54" x2="62" y2="16"/><line x1="62" y1="54" x2="98" y2="42"/>
      <line x1="62" y1="54" x2="84" y2="84"/><line x1="62" y1="54" x2="40" y2="84"/>
      <line x1="62" y1="54" x2="26" y2="42"/>
    </g>
    <g class="art-pulse">
      <polygon points="62,22 90,45 76,76 46,72 36,44" fill="#D4612A" fill-opacity=".18" stroke="#D4612A" stroke-width="1.6"/>
      <g fill="#D4612A">
        <circle cx="62" cy="22" r="2.6"/><circle cx="90" cy="45" r="2.6"/><circle cx="76" cy="76" r="2.6"/>
        <circle cx="46" cy="72" r="2.6"/><circle cx="36" cy="44" r="2.6"/>

/* ── Render ──────────────────────────────────────────────────── */
const esc = (v) => String(v == null ? '' : v)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

const urlLabel = (u) => esc(String(u).replace(/^https?:\/\//, '').replace(/\/$/, ''));

function itemHTML(it){
  const bullets = (it.bullets || []).map(b => '<li>' + esc(b) + '</li>').join('');
  return '<li>' +
    (it.n ? '<span class="n">' + esc(it.n) + '</span>' : '') +
    (it.d ? '<span class="d">' + esc(it.d) + '</span>' : '') +
    (bullets ? '<ul class="bullets">' + bullets + '</ul>' : '') +
  '</li>';
}

function cardHTML(p, i){
  const art = p.imagen
    ? '<img src="' + esc(p.imagen) + '" alt="" loading="lazy">'
    : (ART[p.art] || '');

  return '<article class="card">' +
    '<button class="face" type="button" aria-expanded="false" aria-controls="ov" data-i="' + i + '">' +
      '<span class="art">' +
        '<span class="art-inner">' + art + '</span>' +
        '<span class="plus" aria-hidden="true">+</span>' +
      '</span>' +
      '<span class="body"><span class="pitch">' + esc(p.pitch) + '</span></span>' +
    '</button>' +
  '</article>';
}

function overlayHTML(p, i){
  const art = p.imagen
    ? '<img src="' + esc(p.imagen) + '" alt="">'
    : (ART[p.art] || '');
  const items = (p.items || []).map(itemHTML).join('');

  return '<div class="ov-art">' + art + '</div>' +
    '<div class="ov-body">' +
      '<div class="ov-head">' +
        '<div>' +
          '<span class="meta ov-meta">' +
            '<span class="num">' + String(i + 1).padStart(2, '0') + '</span>' +
            (p.familia ? '<span class="familia">' + esc(p.familia) + '</span>' : '') +
          '</span>' +
          '<h3>' + esc(p.titulo) + '</h3>' +
        '</div>' +
        '<button class="close" type="button" aria-label="Cerrar detalle">&#10005;</button>' +
      '</div>' +
      (p.lead ? '<p class="lead">' + esc(p.lead) + '</p>' : '') +
      (items ? '<ul class="items">' + items + '</ul>' : '') +
      (p.link
        ? '<a class="visit" href="' + esc(p.link) + '" target="_blank" rel="noopener">' +
          urlLabel(p.link) + '<span class="ar" aria-hidden="true">&#8599;</span></a>'
        : '') +
    '</div>';
}

/* ═══════════════════════════════════════════════════════════════
   EL MEME — el gif del laboratorio de Dexter.
   Dos formas de ponerlo, cualquiera de las dos sirve:

   1. Dejar el archivo en el repo:  assets/loquesea.gif
   2. Pegar acá la URL directa del gif (Giphy, Tenor, donde sea).
      Tiene que terminar en .gif y ser el archivo, no la pagina:
      'https://media.giphy.com/media/xxxxx/giphy.gif'

   Si no carga ninguna de las dos, la ficha muestra el dibujo de
   matraces y la pagina no se ve rota.
   ═══════════════════════════════════════════════════════════════ */
const MEME_SRC = '/assets/exploding-chemicals-dexter.gif';

(function(){
  const fig = document.getElementById('meme');
  const img = document.getElementById('memeImg');
  if(!fig || !img) return;
  const fallback = () => fig.classList.add('is-fb');
  img.addEventListener('error', fallback);
  if(MEME_SRC && img.getAttribute('src') !== MEME_SRC) img.src = MEME_SRC;
  if(img.complete && img.naturalWidth === 0) fallback();
})();

const grid = document.getElementById('grid');
grid.innerHTML = PROYECTOS.map(cardHTML).join('');

const backdrop = document.createElement('div');
backdrop.className = 'backdrop';
document.body.appendChild(backdrop);

const overlay = document.createElement('div');
overlay.className = 'overlay';
overlay.id = 'ov';
overlay.setAttribute('role', 'dialog');
overlay.setAttribute('aria-modal', 'true');
overlay.setAttribute('aria-hidden', 'true');
document.body.appendChild(overlay);

/* ── Abrir / cerrar el detalle ───────────────────────────────── */
let abierta = -1;

/* Si el detalle no entra en el panel, baja --so hasta que entre.
   Nunca aparece scroll: escala, no recorta. */
function fitOverlay(){
  const bodyEl = overlay.querySelector('.ov-body');
  if(!bodyEl) return;
  const entra = () => bodyEl.scrollHeight <= bodyEl.clientHeight + 1;
  overlay.style.setProperty('--so', '1');
  if(entra()) return;
  let lo = 0.5, hi = 1, best = 0.5;
  for(let k = 0; k < 12; k++){
    const mid = (lo + hi) / 2;
    overlay.style.setProperty('--so', mid.toFixed(4));
    if(entra()){ best = mid; lo = mid; } else { hi = mid; }
  }
  overlay.style.setProperty('--so', best.toFixed(4));
}

function abrir(i){
  const p = PROYECTOS[i];
  if(!p) return;
  overlay.innerHTML = overlayHTML(p, i);
  overlay.classList.add('is-on');
  backdrop.classList.add('is-on');
  overlay.setAttribute('aria-hidden', 'false');
  grid.querySelectorAll('.face').forEach((f, k) => f.setAttribute('aria-expanded', String(k === i)));
  abierta = i;
  fitOverlay();
  const c = overlay.querySelector('.close');
  if(c) c.focus();
  if(window.gtag) gtag('event', 'lab_proyecto_abierto', { proyecto: p.titulo });
}

function cerrar(){
  if(abierta < 0) return;
  overlay.classList.remove('is-on');
  backdrop.classList.remove('is-on');
  overlay.setAttribute('aria-hidden', 'true');
  const face = grid.querySelectorAll('.face')[abierta];
  grid.querySelectorAll('.face').forEach(f => f.setAttribute('aria-expanded', 'false'));
  abierta = -1;
  if(face) face.focus();
}

overlay.addEventListener('click', (e) => {
  if(e.target.closest('.close')) cerrar();
});

grid.addEventListener('click', (e) => {
  const face = e.target.closest('.face');
  if(!face) return;
  const i = Number(face.dataset.i);
  if(i === abierta) cerrar(); else abrir(i);
});

document.addEventListener('keydown', (e) => { if(e.key === 'Escape') cerrar(); });
document.addEventListener('click', (e) => {
  if(abierta >= 0 && !e.target.closest('#ov') && !e.target.closest('.face')) cerrar();
});

/* ── Que entre todo en una pantalla ──────────────────────────────
   Todo el layout esta en em sobre el font-size de .screen, asi que
   alcanza con bajar --s para que la pagina entera escale. */
const screenEl = document.querySelector('.screen');
const innerEl  = document.querySelector('.inner');
const setS = (v) => document.documentElement.style.setProperty('--s', String(v));

function alto(){
  const cs = getComputedStyle(screenEl);
  return innerEl.getBoundingClientRect().height
       + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
}

function fit(){
  setS(1);
  if(alto() <= screenEl.clientHeight) return;
  let lo = 0.45, hi = 1, best = 0.45;
  for(let i = 0; i < 14; i++){
    const mid = (lo + hi) / 2;
    setS(mid.toFixed(4));
    if(alto() <= screenEl.clientHeight){ best = mid; lo = mid; } else { hi = mid; }
  }
  setS(best.toFixed(4));
}

/* ── Subrayado del H1 ────────────────────────────────────────────
   Portado tal cual del hero de a13i-accelerator: roughjs a mano, dos
   pasadas de linea (ida y vuelta) sobre cada rect del texto. Si el CDN
   no carga, no pasa nada y el texto queda legible igual. */
const NS = 'http://www.w3.org/2000/svg';
let hlSvg = null;

function hlDraw(){
  const el = document.getElementById('hlCuriosidad');
  if(!el || !hlSvg || !window.rough) return;
  while(hlSvg.firstChild) hlSvg.removeChild(hlSvg.firstChild);
  const rc = rough.svg(hlSvg);
  const base = hlSvg.getBoundingClientRect();
  const color = el.getAttribute('data-hl-color') || '#D4612A';
  const rects = el.getClientRects();
  for(let i = 0; i < rects.length; i++){
    const r = rects[i];
    if(r.width < 2) continue;
    const x = r.left - base.left, w = r.width, y = (r.top - base.top) + r.height + 1;
    const o = { stroke:color, strokeWidth:2.5, roughness:1.3, bowing:1.2, disableMultiStroke:true };
    hlSvg.appendChild(rc.line(x, y, x + w, y, o));
    hlSvg.appendChild(rc.line(x + w, y, x, y, o));
  }
}

function hlSetup(){
  const el = document.getElementById('hlCuriosidad');
  if(!el || hlSvg || !window.rough) return;
  el.style.display = 'inline';
  hlSvg = document.createElementNS(NS, 'svg');
  Object.assign(hlSvg.style, {
    position:'absolute', top:'0', left:'0', width:'100px', height:'100px',
    overflow:'visible', pointerEvents:'none'
  });
  el.insertAdjacentElement('afterend', hlSvg);
  hlDraw();
}

let raf;
function relayout(){
  if(raf) cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => { fit(); hlDraw(); if(abierta >= 0) fitOverlay(); });
}

function boot(){
  fit();
  hlSetup();
}

(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve())
  .then(() => setTimeout(boot, 30));
window.addEventListener('load', relayout);
window.addEventListener('resize', relayout, { passive:true });
</script>
