<script async src="https://www.googletagmanager.com/gtag/js?id=G-FV5WCTFBC3"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  gtag('config', 'G-FV5WCTFBC3');

<style>
  :root{
    /* Paleta: idéntica a a13i-accelerator / a13i-partner */
    --bg:          #FEFBF2;
    --card:        #FFFFFF;
    --ui:          #F7F0E4;
    --card-2:      #FDFAF3;
    --border:      #E8E3DE;
    --border-2:    #EAD9C8;
    --text:        #1A1410;
    --muted:       #6B5A4A;
    --faint:       #8C7A68;
    --accent:      #D4612A;
    --accent-2:    #E15E3F;
    --accent-deep: #A04510;
    --green:       #1E8E5A;
    --amber:       #B5790A;

    --sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;

    /* Factor de ajuste: lo baja fit() si el contenido no entra en la pantalla.
       Todo el layout esta en em, asi que con esto escala la pagina entera. */
    --s: 1;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }
  body{
    background:var(--bg); color:var(--text);
    font-family:var(--sans); line-height:1.55;
    overflow:hidden;
  }
  body::before{
    content:''; position:fixed; inset:0; z-index:100;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    opacity:.015; pointer-events:none; mix-blend-mode:multiply;
  }
  body::after{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(900px at 18% -5%, rgba(212,97,42,0.07), transparent 62%);
  }

  a{ color:inherit; text-decoration:none; }
  button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  ::selection{ background:rgba(212,97,42,.22); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:6px; }

  /* ── PANTALLA UNICA ──────────────────────────────────────────── */
  .screen{
    position:relative; z-index:2;
    height:100vh; height:100dvh; overflow:hidden;
    font-size:calc(clamp(10.5px, min(3.1vw, 1.78vh), 17px) * var(--s));
    padding:2.4em clamp(20px,4vw,48px) 2.4em;
    display:flex; align-items:center;
  }
  .inner{ width:100%; max-width:min(1180px, 95vw); margin:0 auto; }

  /* ── ENCABEZADO ──────────────────────────────────────────────── */
  .logo{
    font-family:'Space Grotesk','Arial',sans-serif;
    font-weight:700; font-size:1.5em; letter-spacing:-.02em; line-height:1;
    color:#111; white-space:nowrap; display:inline-block; margin-bottom:1.9em;
  }
  .logo .o{ color:#D44B2A; }
  .logo .it{ font-style:italic; font-size:.92em; }

  .head{
    display:grid; grid-template-columns:minmax(0,1fr) minmax(0,14.5em);
    gap:1.6em 3em; align-items:end;
  }
  .head-text{ min-width:0; }
  h1{
    font-size:min(2.45em, 7.4vw);
    font-weight:700; line-height:1.1; letter-spacing:-.032em;
  }
  .sub{ font-size:1.05em; line-height:1.55; color:var(--muted); margin-top:.85em; }
  .nw{ white-space:nowrap; }

  /* ── MEME ────────────────────────────────────────────────────── */
  .meme{
    position:relative; overflow:hidden; aspect-ratio:4/3;
    border:1px solid var(--border-2); border-radius:1em; background:#FFFDF8;
    box-shadow:0 2px 12px rgba(31,20,16,.06), 0 14px 32px rgba(31,20,16,.08);
    transform:rotate(-1.6deg);
    transition:transform .3s cubic-bezier(.22,1,.36,1);
  }
  .meme:hover{ transform:rotate(0deg) scale(1.015); }
  .meme img, .meme .meme-fb{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; display:block;
  }
  .meme .meme-fb{ display:none; }
  .meme.is-fb img{ display:none; }
  .meme.is-fb .meme-fb{ display:block; }

  /* ── GRILLA PORTFOLIO ────────────────────────────────────────── */
  .grid{
    position:relative;
    margin-top:2.2em;
    display:grid; grid-template-columns:repeat(auto-fit, minmax(12em, 1fr)); gap:1.2em;
  }
  .card{
    position:relative; overflow:hidden; isolation:isolate; display:flex;
    background:var(--card); border:1px solid var(--border-2); border-radius:1.15em;
    box-shadow:0 2px 12px rgba(31,20,16,.05);
    transition:transform .24s cubic-bezier(.22,1,.36,1), box-shadow .24s, border-color .24s;
  }
  .card:hover{ transform:translateY(-3px); box-shadow:0 14px 34px rgba(31,20,16,.11); border-color:rgba(212,97,42,.32); }
  .card:hover .art-inner{ transform:scale(1.04); }
  .face{
    display:flex; flex-direction:column; flex:1; width:100%;
    text-align:left; padding:0; border-radius:inherit; overflow:hidden;
  }

  .art{
    display:block; position:relative; overflow:hidden;
    aspect-ratio:16/10; border-bottom:1px solid var(--border);
    background:#FFFDF8;
  }
  .art-inner{ position:absolute; inset:0; transition:transform .5s cubic-bezier(.22,1,.36,1); }
  .art-inner svg, .art-inner img{ width:100%; height:100%; display:block; object-fit:cover; }

  .body{ display:flex; flex-direction:column; flex:1; padding:1.05em 1.15em 1.15em; }
  .meta{ display:flex; align-items:center; gap:.7em; }
  .num{
    font-family:var(--mono); font-size:.7em; font-weight:600;
    letter-spacing:.16em; color:var(--faint); flex-shrink:0;
  }
  .familia{
    display:inline-flex; align-items:center; gap:.45em; flex-shrink:0;
    font-family:var(--mono); font-size:.66em; font-weight:700;
    letter-spacing:.14em; text-transform:uppercase; color:var(--accent-deep);
  }
  .familia::before{
    content:''; width:.45em; height:.45em; border-radius:50%;
    background:var(--accent); flex-shrink:0;
  }
  /* Unica linea de la ficha: una frase de 8 a 10 palabras que se explica sola.
     El nombre del proyecto aparece recien al abrir el detalle. */
  .pitch{
    display:block; font-size:1.02em; font-weight:700;
    letter-spacing:-.022em; line-height:1.32; color:var(--text);
  }

  /* Unica pista de que la ficha se abre: aparece al pasar por encima.
     Un texto por ficha se repetia seis veces y no sumaba nada. */
  .plus{
    position:absolute; top:.55em; right:.55em; z-index:2;
    width:1.9em; height:1.9em; border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center;
    background:rgba(254,251,242,.94); border:1px solid var(--border-2);
    color:var(--accent); font-size:1em; font-weight:600; line-height:1;
    opacity:0; transform:scale(.8);
    transition:opacity .2s ease, transform .2s cubic-bezier(.22,1,.36,1);
  }
  .card:hover .plus, .face:focus-visible .plus{ opacity:1; transform:scale(1); }

  /* ── MOM TEST ────────────────────────────────────────────────── */
  .momtest{
    display:flex; align-items:flex-end; gap:1.2em;
    margin-top:1.6em; padding-top:1.2em;
    border-top:1px solid var(--border);
  }
  .momtest img{ height:7em; width:auto; flex-shrink:0; margin-bottom:-.2em; }
  .momtest p{
    font-size:.85em; line-height:1.5; color:var(--muted);
    max-width:66ch; padding-bottom:.35em;
  }
  .momtest .lbl{
    font-family:var(--mono); font-size:.8em; font-weight:700;
    letter-spacing:.16em; text-transform:uppercase; color:var(--accent-deep);
    margin-right:.7em;
  }

  /* ── DETALLE: panel sobre toda la grilla ─────────────────────── */
  .backdrop{
    position:fixed; inset:0; z-index:150;
    background:rgba(31,20,16,.34); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .26s ease, visibility 0s linear .26s;
  }
  .backdrop.is-on{ opacity:1; visibility:visible; pointer-events:auto; transition-delay:0s; }

  .overlay{
    position:fixed; z-index:200;
    top:50%; left:50%;
    width:min(1080px, 92vw); height:min(660px, 82vh);
    display:grid; grid-template-columns:36% 1fr;
    background:var(--card); border:1px solid rgba(212,97,42,.35); border-radius:1.15em;
    box-shadow:0 24px 70px rgba(31,20,16,.24); overflow:hidden;
    font-size:calc(1em * var(--so, 1));
    opacity:0; transform:translate(-50%,-50%) scale(.98); pointer-events:none; visibility:hidden;
    transition:opacity .26s ease, transform .26s cubic-bezier(.22,1,.36,1), visibility 0s linear .26s;
  }
  .overlay.is-on{
    opacity:1; transform:translate(-50%,-50%) scale(1);
    pointer-events:auto; visibility:visible; transition-delay:0s;
  }

  .ov-art{
    position:relative; overflow:hidden;
    border-right:1px solid var(--border);
    /* plano y del mismo tono que el fondo de los SVG: asi no se ve el borde
       del arte cuando entra entero en un contenedor mas angosto */
    background:#FFFDF8;
  }
  .ov-art svg, .ov-art img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }

  .ov-body{ display:flex; flex-direction:column; min-width:0; overflow:hidden; padding:1.5em 1.6em 1.4em; }
  .ov-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:1em; }
  .ov-meta{ margin-bottom:.45em; }
  .ov-meta::after{ display:none; }
  .overlay h3{ font-size:1.5em; font-weight:800; letter-spacing:-.035em; line-height:1.15; }
  .close{
    width:2em; height:2em; border-radius:.55em; flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center;
    background:rgba(26,20,16,.06); color:var(--muted); font-size:.95em; line-height:1;
    transition:background .16s, color .16s;
  }
  .close:hover{ background:rgba(212,97,42,.14); color:var(--accent); }
  .overlay .lead{ font-size:.92em; line-height:1.5; color:var(--muted); margin-top:.7em; max-width:62ch; }

  .items{ list-style:none; margin-top:1.1em; display:flex; flex-direction:column; gap:.85em; }
  .items > li{ padding-left:.9em; border-left:2px solid var(--border-2); }
  .items .n{ display:block; font-size:.92em; font-weight:700; letter-spacing:-.015em; color:var(--text); }
  .items .d{ display:block; font-size:.88em; line-height:1.45; color:var(--muted); margin-top:.12em; max-width:64ch; }
  .bullets{ list-style:none; margin-top:.45em; display:flex; flex-direction:column; gap:.35em; }
  .bullets li{
    position:relative; padding-left:1.05em;
    font-size:.88em; line-height:1.45; color:var(--muted); max-width:64ch;
  }
  .bullets li::before{
    content:''; position:absolute; left:0; top:.55em;
    width:.36em; height:.36em; border-radius:50%; background:var(--accent); opacity:.6;
  }
  .ov-foot{ margin-top:auto; padding-top:1.2em; }
  .tech{
    display:flex; flex-direction:column; gap:.85em;
    padding:.85em 0 .9em; border-top:1px solid var(--border);
  }
  .tech-modelos{ display:flex; flex-direction:column; gap:.4em; max-width:34em; }
  .mbar{
    display:flex; height:.45em; border-radius:.25em; overflow:hidden;
    background:var(--ui);
  }
  .mbar i{ display:block; height:100%; }
  .mleg{ display:flex; flex-wrap:wrap; gap:.25em 1.1em; font-size:.78em; color:var(--muted); }
  .mleg span{ display:inline-flex; align-items:center; gap:.4em; }
  .mleg em{ width:.5em; height:.5em; border-radius:50%; font-style:normal; flex-shrink:0; }
  .mleg b{ color:var(--text); font-weight:600; }
  /* Grilla y no flex: con cuatro celdas el flex las parte 3+1 y queda
     desbalanceado. Asi reparten parejo, como una ficha de especificaciones. */
  .tech-row{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(10.5em, 1fr));
    gap:.8em 1.6em; align-items:start;
  }
  .tech-nota{ font-size:.78em; line-height:1.45; color:var(--faint); max-width:62ch; }
  .tech-cel{ display:flex; flex-direction:column; gap:.2em; min-width:0; }
  .tech-l{
    font-family:var(--mono); font-size:.62em; font-weight:700;
    letter-spacing:.16em; text-transform:uppercase; color:var(--faint);
  }
  .mt-aprox{ color:var(--faint); opacity:.7; }
  .tech-v{ font-size:.85em; font-weight:600; letter-spacing:-.01em; color:var(--text); }

  .visit{
    display:inline-flex; align-items:center; gap:.6em; align-self:flex-start;
    padding-top:.2em;
    font-family:var(--mono); font-size:.8em; font-weight:600;
    color:var(--accent-deep); overflow-wrap:anywhere;
  }
  .visit:hover{ color:var(--accent); }
  .visit .ar{ flex-shrink:0; transition:transform .18s; }
  .visit:hover .ar{ transform:translate(2px,-2px); }

  /* ── MOBILE ──────────────────────────────────────────────────────
     La ficha sigue siendo una ficha: arte arriba, frase abajo, en dos
     columnas. Resuelto como lista horizontal el arte quedaba diminuto y
     la grilla dejaba de leerse como portfolio. */
  @media(max-width:820px){
    .screen{
      padding:calc(1.5em + env(safe-area-inset-top)) clamp(16px,4.5vw,28px)
              calc(1.4em + env(safe-area-inset-bottom));
    }
    .logo{ font-size:1.35em; margin-bottom:1.1em; }

    /* El meme al lado del titulo, no en una fila propia: ese renglon
       suelto se comia una franja entera de la pantalla. */
    .head{
      grid-template-columns:minmax(0,1fr) 34%;
      gap:0 1em; align-items:start;
    }
    .meme{ width:100%; max-width:none; transform:rotate(-2deg); margin-top:.3em; }
    .meme:hover{ transform:rotate(-2deg); }
    h1{ font-size:min(2.15em, 6.6vw); line-height:1.14; }
    .sub{ font-size:.95em; margin-top:.7em; }

    .grid{
      margin-top:1.3em;
      grid-template-columns:repeat(3, minmax(0,1fr)); gap:.8em;
    }
    .card{ border-radius:.95em; }
    .card:hover{ transform:none; box-shadow:0 2px 12px rgba(31,20,16,.05); }
    .card:active{ transform:scale(.975); border-color:rgba(212,97,42,.4); }
    .card:hover .art-inner{ transform:none; }
    .body{ padding:.75em .85em .85em; justify-content:center; }
    .pitch{ font-size:.93em; line-height:1.28; }

    /* En touch no hay hover: el + queda siempre, tenue, como pista. */
    .plus{
      display:inline-flex; opacity:.55; transform:scale(1);
      width:1.7em; height:1.7em; font-size:.9em;
    }
    .card:active .plus{ opacity:1; }

    .momtest{
      margin-top:1.1em; padding-top:.9em; gap:.7em; align-items:center;
    }
    .momtest img{ height:3.4em; margin-bottom:0; }
    .momtest p{ font-size:.78em; line-height:1.45; padding-bottom:0; }
    .momtest .lbl{ margin-right:.5em; }

    /* El detalle ocupa toda la pantalla */
    .overlay{
      top:0; left:0; width:100%; height:100%;
      border-radius:0; border:0;
      grid-template-columns:1fr; grid-template-rows:auto 1fr;
      transform:translate(0,2%) scale(1);
    }
    .overlay.is-on{ transform:translate(0,0) scale(1); }
    .ov-art{
      height:20vh; border-right:0; border-bottom:1px solid var(--border);
    }
    .ov-body{
      padding:1.3em 1.2em calc(1.2em + env(safe-area-inset-bottom));
      overflow:auto; -webkit-overflow-scrolling:touch;
    }
    .overlay h3{ font-size:1.32em; }
    /* Boton de cerrar flotante sobre el arte, comodo para el pulgar */
    .close{
      position:absolute; top:calc(.8em + env(safe-area-inset-top)); right:.8em;
      width:2.3em; height:2.3em; min-width:44px; min-height:44px;
      border-radius:50%; font-size:1.05em; z-index:3;
      background:rgba(254,251,242,.92); border:1px solid var(--border-2);
      box-shadow:0 2px 10px rgba(31,20,16,.14);
    }
    .visit{ font-size:.82em; padding-top:.2em; }
    .tech{ gap:.7em; padding:.7em 0 .8em; }
    .tech-row{ grid-template-columns:repeat(auto-fit, minmax(8.5em, 1fr)); gap:.7em 1.1em; }
  }

  /* Telefono: dos columnas. Tres ya no entran sin que el arte se achique. */
  @media(max-width:560px){
    .grid{ grid-template-columns:repeat(2, minmax(0,1fr)); gap:.7em; }
  }

  /* Telefonos angostos o bajos: el titulo es el bloque mas caro, se achica
     mas que el resto para que el texto de las fichas no pague el ajuste. */
  @media(max-width:400px), (max-height:700px) and (max-width:820px){
    .head{ grid-template-columns:minmax(0,1fr) 36%; }
    h1{ font-size:min(1.92em, 6.1vw); line-height:1.13; }
    .sub{ font-size:.9em; margin-top:.55em; }
    .logo{ font-size:1.2em; margin-bottom:.85em; }
    .grid{ margin-top:1em; gap:.6em; }
    .momtest{ margin-top:.9em; padding-top:.75em; }
    .momtest img{ height:3em; }
  }

  /* Landscape de telefono: con 390px de alto no entran dos filas de fichas,
     asi que van todas en una sola, como en desktop. */
  @media(orientation:landscape) and (max-height:540px){
    .screen{ padding:.9em clamp(14px,3vw,24px); }
    .meme{ display:none; }
    .head{ display:block; }
    .logo{ font-size:1.1em; margin-bottom:.5em; }
    h1{ font-size:min(1.5em, 3.4vw); line-height:1.1; max-width:40ch; }
    .sub{ font-size:.82em; margin-top:.35em; }
    .grid{
      margin-top:.8em;
      grid-template-columns:repeat(6, minmax(0,1fr)) !important; gap:.5em;
    }
    .card{ border-radius:.7em; }
    .body{ padding:.55em .6em .6em; }
    .pitch{ font-size:.8em; line-height:1.25; }
    .plus{ display:none; }
    .momtest{ margin-top:.7em; padding-top:.6em; gap:.6em; }
    .momtest img{ height:2.4em; }
    .momtest p{ font-size:.72em; }
    .ov-art{ height:26vh; }
  }

  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{ animation:none !important; transition-duration:.001ms !important; }
    .art-inner{ transform:none !important; }
  }
</style>
</head>
<body>

<div class="screen">
  <div class="inner">

    <span class="logo">A<span class="o">13</span>I<span class="o">_</span><span class="it">LAB</span></span>

    <div class="head">
        <div class="head-text">
          <h1>Mi sueño era ser <span data-hl="underline" data-hl-color="#D4612A">científico loco</span> y tener un <span data-hl="highlight" data-hl-color="rgba(225,94,63,0.22)">laboratorio como el de Dexter</span>.</h1>
          <p class="sub">Hoy gracias a la IA voy plasmando casi toda mi curiosidad en <span class="nw">experimentos&nbsp;🔬🧫</span></p>
        </div>

        <!-- El GIF va en assets/dexter-lab.gif. Si no esta, cae solo en el
             dibujo de abajo y la pagina no se ve rota. -->
        <figure class="meme" id="meme">
          <img src="/assets/exploding-chemicals-dexter.gif" alt="El laboratorio de Dexter" id="memeImg">

/* ── Render ──────────────────────────────────────────────────── */
const esc = (v) => String(v == null ? '' : v)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

const urlLabel = (u) => esc(String(u).replace(/^https?:\/\//, '').replace(/\/$/, ''));

function itemHTML(it){
  const bullets = (it.bullets || []).map(b => '<li>' + esc(b) + '</li>').join('');
  return '<li>' +
    (it.n ? '<span class="n">' + esc(it.n) + '</span>' : '') +
    (it.d ? '<span class="d">' + esc(it.d) + '</span>' : '') +
    (bullets ? '<ul class="bullets">' + bullets + '</ul>' : '') +
  '</li>';
}

function cardHTML(p, i){
  const art = p.imagen
    ? '<img src="' + esc(p.imagen) + '" alt="" loading="lazy">'
    : (ART[p.art] || '');

  return '<article class="card">' +
    '<button class="face" type="button" aria-expanded="false" aria-controls="ov" data-i="' + i + '">' +
      '<span class="art">' +
        '<span class="art-inner">' + art + '</span>' +
        '<span class="plus" aria-hidden="true">+</span>' +
      '</span>' +
      '<span class="body"><span class="pitch">' + esc(p.pitch) + '</span></span>' +
    '</button>' +
  '</article>';
}

/* Ficha tecnica del detalle: con que se construyo, con que esta hecho y
   cuanto costo. Los tres son aproximados y la pagina lo dice: el reparto
   de modelos es de memoria de Axel y los tokens salen del tamano del
   repo por un multiplicador segun como se construyo. */
const MODELO_COLORES = ['#D4612A', '#E9A57A', '#F0CDB0'];

function barraModelos(modelos){
  const barra = modelos.map((m, k) =>
    '<i style="width:' + m.p + '%;background:' + MODELO_COLORES[k % 3] + '"></i>'
  ).join('');
  const leyenda = modelos.map((m, k) =>
    '<span><em style="background:' + MODELO_COLORES[k % 3] + '"></em>' +
    '<b>' + esc(m.n) + '</b> ' + m.p + '%</span>'
  ).join('');
  return '<div class="tech-modelos">' +
    '<span class="tech-l">Modelos <span class="mt-aprox">aprox.</span></span>' +
    '<span class="mbar">' + barra + '</span>' +
    '<span class="mleg">' + leyenda + '</span>' +
  '</div>';
}

function fichaTecnica(p){
  /* De lo medido a lo estimado. La credibilidad se gana en ese orden:
     primero lo que sale de git, despues lo que se infiere de eso. */
  const celdas = [];
  if(p.tech && p.tech.length) celdas.push({ l:'Tecnología', v:p.tech.join(' · ') });
  if(p.ritmo) celdas.push({ l:'Ritmo', v:p.ritmo });
  if(p.prompts) celdas.push({ l:'Prompts', v:p.prompts });
  if(p.tokens) celdas.push({ l:'Tokens <span class="mt-aprox">estimados</span>', v:p.tokens });
  if(p.costo) celdas.push({ l:'Equivalente <span class="mt-aprox">en API</span>', v:p.costo });

  const modelos = (p.modelos && p.modelos.length) ? barraModelos(p.modelos) : '';
  const fila = celdas.length
    ? '<div class="tech-row">' + celdas.map(c =>
        '<span class="tech-cel"><span class="tech-l">' + c.l + '</span>' +
        '<span class="tech-v">' + esc(c.v) + '</span></span>').join('') + '</div>'
    : '';
  const nota = p.nota ? '<p class="tech-nota">' + esc(p.nota) + '</p>' : '';

  return (modelos || fila || nota) ? '<div class="tech">' + modelos + fila + nota + '</div>' : '';
}

function overlayHTML(p, i){
  const art = p.imagen
    ? '<img src="' + esc(p.imagen) + '" alt="">'
    : (ART[p.art] || '');
  const items = (p.items || []).map(itemHTML).join('');

  return '<div class="ov-art">' + art + '</div>' +
    '<div class="ov-body">' +
      '<div class="ov-head">' +
        '<div>' +
          '<span class="meta ov-meta">' +
            '<span class="num">' + String(i + 1).padStart(2, '0') + '</span>' +
            (p.familia ? '<span class="familia">' + esc(p.familia) + '</span>' : '') +
          '</span>' +
          '<h3>' + esc(p.titulo) + '</h3>' +
        '</div>' +
        '<button class="close" type="button" aria-label="Cerrar detalle">&#10005;</button>' +
      '</div>' +
      (p.lead ? '<p class="lead">' + esc(p.lead) + '</p>' : '') +
      (items ? '<ul class="items">' + items + '</ul>' : '') +
      '<div class="ov-foot">' +
        fichaTecnica(p) +
        (p.link
          ? '<a class="visit" href="' + esc(p.link) + '" target="_blank" rel="noopener">' +
            urlLabel(p.link) + '<span class="ar" aria-hidden="true">&#8599;</span></a>'
          : '') +
      '</div>' +
    '</div>';
}

/* ═══════════════════════════════════════════════════════════════
   EL MEME — el gif del laboratorio de Dexter.
   Dos formas de ponerlo, cualquiera de las dos sirve:

   1. Dejar el archivo en el repo:  assets/loquesea.gif
   2. Pegar acá la URL directa del gif (Giphy, Tenor, donde sea).
      Tiene que terminar en .gif y ser el archivo, no la pagina:
      'https://media.giphy.com/media/xxxxx/giphy.gif'

   Si no carga ninguna de las dos, la ficha muestra el dibujo de
   matraces y la pagina no se ve rota.
   ═══════════════════════════════════════════════════════════════ */
const MEME_SRC = '/assets/exploding-chemicals-dexter.gif';

(function(){
  const fig = document.getElementById('meme');
  const img = document.getElementById('memeImg');
  if(!fig || !img) return;
  const fallback = () => fig.classList.add('is-fb');
  img.addEventListener('error', fallback);
  if(MEME_SRC && img.getAttribute('src') !== MEME_SRC) img.src = MEME_SRC;
  if(img.complete && img.naturalWidth === 0) fallback();
})();

const grid = document.getElementById('grid');
grid.innerHTML = PROYECTOS.map(cardHTML).join('');

const backdrop = document.createElement('div');
backdrop.className = 'backdrop';
document.body.appendChild(backdrop);

const overlay = document.createElement('div');
overlay.className = 'overlay';
overlay.id = 'ov';
overlay.setAttribute('role', 'dialog');
overlay.setAttribute('aria-modal', 'true');
overlay.setAttribute('aria-hidden', 'true');
document.body.appendChild(overlay);

/* ── Abrir / cerrar el detalle ───────────────────────────────── */
let abierta = -1;

/* Si el detalle no entra en el panel, baja --so hasta que entre.
   Nunca aparece scroll: escala, no recorta. */
function fitOverlay(){
  const bodyEl = overlay.querySelector('.ov-body');
  if(!bodyEl) return;
  const entra = () => bodyEl.scrollHeight <= bodyEl.clientHeight + 1;
  overlay.style.setProperty('--so', '1');
  if(entra()) return;
  let lo = 0.5, hi = 1, best = 0.5;
  for(let k = 0; k < 12; k++){
    const mid = (lo + hi) / 2;
    overlay.style.setProperty('--so', mid.toFixed(4));
    if(entra()){ best = mid; lo = mid; } else { hi = mid; }
  }
  overlay.style.setProperty('--so', best.toFixed(4));
}

/* El detalle entra en el historial. En mobile ocupa toda la pantalla y el
   gesto natural para volver es el boton atras del navegador: sin esto te
   sacaba del sitio en vez de cerrar la ficha. De paso cada proyecto queda
   con su propia URL, asi se puede compartir el link a uno solo. */
const slug = (t) => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

let enHistorial = false;

function abrirUI(i){
  const p = PROYECTOS[i];
  overlay.innerHTML = overlayHTML(p, i);
  overlay.classList.add('is-on');
  backdrop.classList.add('is-on');
  overlay.setAttribute('aria-hidden', 'false');
  grid.querySelectorAll('.face').forEach((f, k) => f.setAttribute('aria-expanded', String(k === i)));
  abierta = i;
  fitOverlay();
  const c = overlay.querySelector('.close');
  if(c) c.focus();
}

function cerrarUI(){
  if(abierta < 0) return;
  overlay.classList.remove('is-on');
  backdrop.classList.remove('is-on');
  overlay.setAttribute('aria-hidden', 'true');
  const face = grid.querySelectorAll('.face')[abierta];
  grid.querySelectorAll('.face').forEach(f => f.setAttribute('aria-expanded', 'false'));
  abierta = -1;
  if(face) face.focus();
}

function abrir(i){
  const p = PROYECTOS[i];
  if(!p) return;
  /* Cambiar de ficha con una ya abierta reemplaza la entrada, no apila otra:
     si no, atras te haria recorrer todas las que miraste. */
  const url = '#' + slug(p.titulo);
  try{
    if(enHistorial) history.replaceState({ lab: i }, '', url);
    else { history.pushState({ lab: i }, '', url); enHistorial = true; }
  }catch(e){ /* file:// y casos raros: sigue andando sin historial */ }
  abrirUI(i);
  if(window.gtag) gtag('event', 'lab_proyecto_abierto', { proyecto: p.titulo });
}

function cerrar(){
  if(abierta < 0) return;
  if(enHistorial){
    enHistorial = false;
    history.back();   // el popstate hace el cierre visual
    return;
  }
  cerrarUI();
}

window.addEventListener('popstate', (e) => {
  const i = e.state && typeof e.state.lab === 'number' ? e.state.lab : -1;
  if(i >= 0 && PROYECTOS[i]){
    /* Volvio con "adelante" a una ficha */
    enHistorial = true;
    abrirUI(i);
  } else {
    enHistorial = false;
    cerrarUI();
  }
});

overlay.addEventListener('click', (e) => {
  if(e.target.closest('.close')) cerrar();
});

grid.addEventListener('click', (e) => {
  const face = e.target.closest('.face');
  if(!face) return;
  const i = Number(face.dataset.i);
  if(i === abierta) cerrar(); else abrir(i);
});

document.addEventListener('keydown', (e) => { if(e.key === 'Escape') cerrar(); });
document.addEventListener('click', (e) => {
  if(abierta >= 0 && !e.target.closest('#ov') && !e.target.closest('.face')) cerrar();
});

/* ── Que entre todo en una pantalla ──────────────────────────────
   Todo el layout esta en em sobre el font-size de .screen, asi que
   alcanza con bajar --s para que la pagina entera escale. */
const screenEl = document.querySelector('.screen');
const innerEl  = document.querySelector('.inner');
const setS = (v) => document.documentElement.style.setProperty('--s', String(v));

function alto(){
  const cs = getComputedStyle(screenEl);
  return innerEl.getBoundingClientRect().height
       + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
}

function fit(){
  setS(1);
  screenEl.style.overflowY = 'hidden';
  if(alto() <= screenEl.clientHeight) return;

  let lo = 0.45, hi = 1, best = 0.45;
  for(let i = 0; i < 14; i++){
    const mid = (lo + hi) / 2;
    setS(mid.toFixed(4));
    if(alto() <= screenEl.clientHeight){ best = mid; lo = mid; } else { hi = mid; }
  }
  setS(best.toFixed(4));

  /* Si ni al piso de escala entra (una pantalla rarisima, o muchos
     proyectos), que scrollee. Cortar contenido siempre es peor. */
  if(alto() > screenEl.clientHeight + 1) screenEl.style.overflowY = 'auto';
}

/* ── Subrayado y resaltado del H1 ────────────────────────────────
   Portado del hero de a13i-accelerator, que no usa rough-notation sino
   roughjs directo: el subrayado son dos pasadas de linea (ida y vuelta)
   y el resaltado es UNA linea del grosor del renglon, en naranja al 22%,
   dibujada detras del texto. Se marcan con data-hl en el HTML.
   Si el CDN no carga, no pasa nada: el texto queda legible igual. */
const NS = 'http://www.w3.org/2000/svg';

function hlSvg(el){
  if(el.__hlsvg) return el.__hlsvg;
  const svg = document.createElementNS(NS, 'svg');
  Object.assign(svg.style, {
    position:'absolute', top:'0', left:'0', width:'100px', height:'100px',
    overflow:'visible', pointerEvents:'none'
  });
  el.style.display = 'inline';
  if(el.getAttribute('data-hl') === 'highlight'){
    /* antes del span, asi el trazo queda debajo del texto */
    const pos = getComputedStyle(el).position;
    if(!pos || pos === 'static') el.style.position = 'relative';
    el.insertAdjacentElement('beforebegin', svg);
  } else {
    el.insertAdjacentElement('afterend', svg);
  }
  el.__hlsvg = svg;
  return svg;
}

function hlDrawOne(el){
  const svg = el.__hlsvg;
  if(!svg || !window.rough) return;
  while(svg.firstChild) svg.removeChild(svg.firstChild);

  const rc    = rough.svg(svg);
  const base  = svg.getBoundingClientRect();
  const tipo  = el.getAttribute('data-hl');
  const color = el.getAttribute('data-hl-color') || '#D4612A';
  const fs    = parseFloat(getComputedStyle(el).fontSize) || 24;
  const rects = el.getClientRects();

  for(let i = 0; i < rects.length; i++){
    const r = rects[i];
    if(r.width < 2) continue;
    const x = r.left - base.left, w = r.width;

    if(tipo === 'highlight'){
      const ym = (r.top - base.top) + r.height / 2;
      svg.appendChild(rc.line(x - 2, ym, x + w + 2, ym, {
        stroke:color, strokeWidth:r.height * 0.88,
        roughness:2.4, bowing:0.5, disableMultiStroke:true
      }));
    } else {
      /* El trazo va en la zona del descendente, no al pie de la caja del
         span: con line-height ajustado esa caja ya invade la linea de
         abajo y el subrayado terminaba encima del texto siguiente.
         El grosor y el temblor acompanian al tamano de letra: los valores
         fijos de accelerator son para un titulo de 50px y a los 23px de
         mobile quedan gruesos y se van de linea. */
      const y   = (r.top - base.top) + r.height * 0.87;
      const sw  = Math.max(1.5, Math.min(2.5, fs / 15));
      const bow = fs < 28 ? 0.7 : 1.2;
      const o   = { stroke:color, strokeWidth:sw, roughness:1.3, bowing:bow, disableMultiStroke:true };
      svg.appendChild(rc.line(x, y, x + w, y, o));
      svg.appendChild(rc.line(x + w, y, x, y, o));
    }
  }
}

function hlSetup(){
  if(!window.rough) return;
  document.querySelectorAll('[data-hl]').forEach(el => { hlSvg(el); hlDrawOne(el); });
}

function hlDraw(){
  document.querySelectorAll('[data-hl]').forEach(el => { if(el.__hlsvg) hlDrawOne(el); });
}

let raf;
function relayout(){
  if(raf) cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => { fit(); hlDraw(); if(abierta >= 0) fitOverlay(); });
}

function boot(){
  fit();
  hlSetup();
  /* Si el link venia apuntando a un proyecto, se abre solo */
  const h = decodeURIComponent((location.hash || '').slice(1));
  if(h){
    const i = PROYECTOS.findIndex(p => slug(p.titulo) === h);
    if(i >= 0){
      /* Entrando por link, replaceState solo no alcanza: no deja entrada a la
         cual volver, y la X terminaba sacandote del sitio. Se arma el par
         base -> detalle, asi cerrar vuelve al lab y no al sitio anterior. */
      try{
        history.replaceState(null, '', location.pathname + location.search);
        history.pushState({ lab: i }, '', '#' + h);
        enHistorial = true;
      }catch(e){ enHistorial = false; }
      abrirUI(i);
    }
  }
}

(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve())
  .then(() => setTimeout(boot, 30));
window.addEventListener('load', relayout);
window.addEventListener('resize', relayout, { passive:true });
</script>
